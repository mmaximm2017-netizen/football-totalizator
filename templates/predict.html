{% extends "base.html" %}
{% block content %}
<h2>Доступные дни для ставок</h2>

{% if days %}
<ul style="list-style: none; padding: 0;">
    {% for d in days %}
    <li style="margin: 10px 0;">
        <a href="/predict/{{ d.key }}" style="font-size: 18px; text-decoration: none; color: #2e7d32;">
            📅 {{ d.label }} — {{ d.count }} матчей
        </a>
    </li>
    {% endfor %}
</ul>
{% else %}
<p>Нет доступных матчей для ставок.</p>
{% endif %}
{% endblock %}
