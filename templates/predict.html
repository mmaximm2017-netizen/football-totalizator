{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom: 16px;">📅 Доступные дни для ставок</h2>

{% if days %}
<ul class="day-list">
    {% for d in days %}
    <li>
        <a href="/predict/{{ d.key }}">
            <span>📅 {{ d.label }}</span>
            <span class="badge">{{ d.count }} матч.</span>
        </a>
    </li>
    {% endfor %}
</ul>
{% else %}
<div class="card" style="text-align: center; padding: 30px;">
    <p>Нет доступных матчей для ставок.</p>
</div>
{% endif %}
{% endblock %}
