{% extends "base.html" %}
{% block content %}
<h2 style="text-align: center; margin-bottom: 16px;">⚙️ Админ-панель</h2>

<!-- Обновить матчи -->
<div class="card">
    <div class="card-header">🔄 Обновить матчи из API</div>
    <form method="post">
        <input type="hidden" name="action" value="update_matches">
        <button type="submit" class="btn btn-primary" style="width: 100%;">Обновить сейчас</button>
    </form>
</div>

<!-- Добавить матч -->
<div class="card">
    <div class="card-header">➕ Добавить матч вручную</div>
    <form method="post">
        <input type="hidden" name="action" value="add_match">
        
        <label>Команда 1</label>
        <input type="text" name="home_team" required placeholder="Например: Спартак">
        
        <label>Команда 2</label>
        <input type="text" name="away_team" required placeholder="Например: ЦСКА">
        
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>Дата матча</label>
                <input type="date" name="match_date" required style="width: 100%;">
            </div>
            <div style="flex: 1;">
                <label>Время МСК</label>
                <input type="time" name="match_time" value="19:00" required style="width: 100%;">
            </div>
        </div>
        
        <label>Турнир</label>
        <select name="league">
            <option value="other">📋 Другое</option>
            <option value="wc2026">🏆 ЧМ-2026</option>
            <option value="rpl">🇷🇺 РПЛ</option>
            <option value="rcup">🏆 Кубок России</option>
        </select>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Добавить матч</button>
    </form>
</div>

<!-- Внести результат -->
<div class="card">
    <div class="card-header">✅ Внести результат</div>
    <form method="post">
        <input type="hidden" name="action" value="set_result">
        
        <label>Матч</label>
        <select name="match_id" required>
            {% for m in free_matches %}
            <option value="{{ m.id }}">{{ m.home_team }} – {{ m.away_team }}</option>
            {% endfor %}
        </select>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <div style="flex: 1;">
                <label>Хозяева</label>
                <input type="number" name="home_score" min="0" required style="width: 100%;">
            </div>
            <span style="font-size: 20px; font-weight: bold; margin-top: 20px;">:</span>
            <div style="flex: 1;">
                <label>Гости</label>
                <input type="number" name="away_score" min="0" required style="width: 100%;">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">Внести результат</button>
    </form>
</div>

<!-- Отменить матч -->
<div class="card">
    <div class="card-header">❌ Отменить матч</div>
    <form method="post">
        <input type="hidden" name="action" value="cancel_match">
        
        <label>Матч</label>
        <select name="match_id" required>
            {% for m in all_matches %}
            <option value="{{ m.id }}">{{ m.home_team }} – {{ m.away_team }} ({{ m.status }})</option>
            {% endfor %}
        </select>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; background: #c62828;">Отменить матч</button>
    </form>
</div>

<!-- Сброс таблицы -->
<div class="card">
    <div class="card-header">🔄 Сбросить турнирную таблицу</div>
    <form method="post" onsubmit="return confirm('Точно обнулить все очки и результаты? Это действие необратимо!')">
        <input type="hidden" name="action" value="reset_all_points">
        <button type="submit" class="btn btn-primary" style="width: 100%; background: #c62828;">Обнулить все очки</button>
    </form>
</div>

<!-- Список пользователей -->
<div class="card">
    <div class="card-header">👥 Список пользователей</div>
    <div style="overflow-x: auto;">
        <table>
            <tr style="background: #263238; color: white;">
                <th style="padding: 10px;">ID</th>
                <th style="padding: 10px;">Имя</th>
            </tr>
            {% for u in users %}
            <tr style="border-bottom: 1px solid #eee;">
                <td style="padding: 10px;">{{ u.id }}</td>
                <td style="padding: 10px;">{{ u.username }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
