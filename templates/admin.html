{% extends "base.html" %}
{% block content %}
<h2>Админ-панель</h2>

<h3>Обновить матчи из API</h3>
<form method="post">
    <input type="hidden" name="action" value="update_matches">
    <button type="submit">Обновить сейчас</button>
</form>

<h3>Добавить матч вручную</h3>
<form method="post">
    <input type="hidden" name="action" value="add_match">
    <label>Команда 1</label><input type="text" name="home_team" required>
    <label>Команда 2</label><input type="text" name="away_team" required>
    <label>Дата и время МСК (ГГГГ-ММ-ДД ЧЧ:ММ)</label>
    <input type="text" name="kickoff_msk" placeholder="2026-06-13 18:00" required>
    <button type="submit">Добавить</button>
</form>

<h3>Внести результат</h3>
<form method="post">
    <input type="hidden" name="action" value="set_result">
    <label>ID матча</label>
    <select name="match_id" required>
        {% for m in free_matches %}
        <option value="{{ m.id }}">{{ m.id }} {{ m.home_team }} – {{ m.away_team }}</option>
        {% endfor %}
    </select>
    <label>Голы хозяев</label><input type="number" name="home_score" min="0" required>
    <label>Голы гостей</label><input type="number" name="away_score" min="0" required>
    <button type="submit">Внести результат</button>
</form>

<h3>Отменить матч</h3>
<form method="post">
    <input type="hidden" name="action" value="cancel_match">
    <label>ID матча</label>
    <select name="match_id" required>
        {% for m in all_matches %}
        <option value="{{ m.id }}">{{ m.id }} {{ m.home_team }} – {{ m.away_team }} ({{ m.status }})</option>
        {% endfor %}
    </select>
    <button type="submit">Отменить матч</button>
</form>

<h3>Список пользователей</h3>
<table>
    <tr><th>ID</th><th>Имя</th></tr>
    {% for u in users %}
    <tr><td>{{ u.id }}</td><td>{{ u.username }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
