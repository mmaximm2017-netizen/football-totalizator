{% extends "base.html" %}
{% block content %}

<style>
    .auth-screen {
        min-height: calc(100vh - 180px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 10px;
    }

    .auth-card {
        position: relative;
        overflow: hidden;
        width: 100%;
        max-width: 420px;
        border-radius: 30px;
        padding: 28px 22px;
        background:
            radial-gradient(circle at 50% 0%, rgba(255,255,255,0.92), transparent 35%),
            radial-gradient(circle at 12% 12%, rgba(42,168,255,0.18), transparent 32%),
            linear-gradient(160deg, rgba(255,255,255,0.86), rgba(224,243,255,0.76));
        border: 1px solid rgba(255,255,255,0.68);
        box-shadow:
            0 16px 42px rgba(0,78,140,0.16),
            inset 0 0 0 1px rgba(255,255,255,0.46);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    .auth-top {
        text-align: center;
        margin-bottom: 24px;
    }

    .auth-logo {
        width: 92px;
        height: 92px;
        margin: 0 auto 18px;
        border-radius: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, rgba(255,255,255,0.96), rgba(214,228,255,0.92));
        color: #063b73;
        font-size: 44px;
        box-shadow:
            0 0 0 7px rgba(255,255,255,0.36),
            0 0 34px rgba(42,168,255,0.20),
            0 16px 34px rgba(0,78,140,0.16);
    }

    .auth-logo img {
        width: 62px;
        height: 62px;
        object-fit: contain;
        display: block;
    }

    .auth-title {
        font-size: 28px;
        font-weight: 1000;
        letter-spacing: -0.5px;
        color: #063b73;
        margin-bottom: 8px;
    }

    .auth-subtitle {
        color: #5d7894;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.4;
    }

    .auth-form {
        margin-top: 20px;
    }

    .auth-input {
        height: 56px !important;
        border-radius: 18px !important;
        background: rgba(255,255,255,0.72) !important;
        border: 1px solid rgba(0,119,200,0.14) !important;
        margin-bottom: 16px !important;
        font-size: 16px !important;
        font-weight: 700;
        color: #063b73 !important;
        box-shadow:
            inset 0 0 0 1px rgba(255,255,255,0.58),
            0 8px 18px rgba(0,78,140,0.08);
    }

    .auth-input::placeholder {
        color: rgba(93,120,148,0.68) !important;
    }

    .auth-input:focus {
        border-color: rgba(0,119,200,0.40) !important;
        box-shadow:
            0 0 0 4px rgba(0,119,200,0.12),
            0 10px 22px rgba(0,78,140,0.10) !important;
    }

    .auth-btn {
        width: 100%;
        height: 56px;
        margin-top: 4px;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, #0077c8, #2aa8ff);
        color: white;
        font-size: 16px;
        font-weight: 1000;
        box-shadow: 0 14px 30px rgba(0,119,200,0.22);
        transition:
            transform 0.18s ease,
            box-shadow 0.18s ease,
            filter 0.18s ease;
    }

    .auth-btn:active {
        transform: scale(0.985);
    }

    .auth-bottom {
        margin-top: 22px;
        text-align: center;
    }

    .auth-link {
        color: #0077c8;
        text-decoration: none;
        font-size: 14px;
        font-weight: 900;
    }

    .auth-link:focus-visible {
        outline: 2px solid rgba(0,119,200,0.42);
        outline-offset: 4px;
        border-radius: 8px;
    }
</style>

<div class="auth-screen">
    <div class="auth-card">
        <div class="auth-top">
            <div class="auth-logo">
                <img src="/static/icon-192-new.png" alt="App icon">
            </div>

            <div class="auth-title">
                Регистрация
            </div>

            <div class="auth-subtitle">
                Присоединяйтесь к закрытому турниру
            </div>
        </div>

        <form method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label>Логин</label>
            <input class="auth-input" type="text" name="username" required placeholder="Придумайте логин">

            <label>Пароль</label>
            <input class="auth-input" type="password" name="password" required placeholder="Придумайте пароль">

            <label>Инвайт-код</label>
            <input class="auth-input" type="text" name="invite_code" required placeholder="Введите инвайт-код">

            <button type="submit" class="auth-btn">
                Зарегистрироваться
            </button>
        </form>

        <div class="auth-bottom">
            <a href="/login" class="auth-link">
                Уже есть аккаунт? Войти
            </a>
        </div>
    </div>
</div>

{% endblock %}
