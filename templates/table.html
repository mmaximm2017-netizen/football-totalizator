{% extends "base.html" %}
{% block content %}

<style>
    #cup-standings-header,
    #wc-standings-header {
        min-height: 72px;
        padding: 12px 14px;
        border-radius: 22px;
        margin-bottom: 12px !important;
        border: 1px solid rgba(255,255,255,0.58);
        box-shadow:
            0 12px 30px rgba(0,78,140,0.14),
            inset 0 1px 0 rgba(255,255,255,0.44);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }

    #cup-standings-header {
        background:
            linear-gradient(160deg, rgba(255,255,255,0.84), rgba(232,246,255,0.72));
    }

    #wc-standings-header {
        background:
            radial-gradient(circle at 50% 0%, rgba(216,180,90,0.14), transparent 48%),
            linear-gradient(160deg, rgba(10,20,40,0.86), rgba(13,31,58,0.78));
        border-color: rgba(216,180,90,0.24);
        box-shadow:
            0 14px 32px rgba(0,0,0,0.24),
            inset 0 1px 0 rgba(255,255,255,0.08);
    }

    #cup-standings-header img,
    #wc-standings-header img {
        width: 44px !important;
        height: 44px !important;
        flex-shrink: 0;
    }

    #cup-standings-header div,
    #wc-standings-header div {
        min-width: 0;
    }

    #cup-standings-header div div:first-child,
    #wc-standings-header div div:first-child {
        font-size: 18px !important;
        font-weight: 1000 !important;
        line-height: 1.1;
        letter-spacing: 0 !important;
    }

    #cup-standings-header div div:last-child,
    #wc-standings-header div div:last-child {
        margin-top: 3px;
        font-size: 13px !important;
        font-weight: 800 !important;
        line-height: 1.15;
        color: rgba(93,120,148,0.86) !important;
    }

    #wc-standings-header div div:last-child {
        color: rgba(255,255,255,0.76) !important;
    }

    @media (max-width: 430px) {
        #cup-standings-header,
        #wc-standings-header {
            justify-content: flex-start !important;
            min-height: 68px;
            gap: 10px !important;
            padding: 11px 12px;
            border-radius: 20px;
        }

        #cup-standings-header img,
        #wc-standings-header img {
            width: 40px !important;
            height: 40px !important;
        }
    }

    /* WC2026 V2 table header rollout: scoped visual layer only. */
    body.tournament-wc2026 #wc-standings-header {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        min-height: 78px;
        background:
            radial-gradient(circle at 88% 10%, #ff5f50 0 15%, transparent 15.5%),
            radial-gradient(circle at 12% 88%, #d8ff22 0 13%, transparent 13.5%),
            radial-gradient(circle at 68% 72%, rgba(184,50,255,0.72) 0 17%, transparent 17.5%),
            linear-gradient(145deg, rgba(0,23,216,0.96), rgba(0,8,90,0.92)) !important;
        border: 1px solid rgba(31,231,255,0.34) !important;
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.18),
            0 18px 38px rgba(0,5,70,0.36) !important;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }

    body.tournament-wc2026 #wc-standings-header::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
            radial-gradient(circle at 24% 24%, rgba(31,231,255,0.34) 0 18%, transparent 18.5%),
            linear-gradient(135deg, rgba(255,255,255,0.10), transparent 45%);
        pointer-events: none;
    }

    body.tournament-wc2026 .wc-trophy-table-bg {
        position: absolute;
        left: 50%;
        top: 55% !important;
        z-index: 0;
        width: 65% !important;
        height: auto !important;
        opacity: 0.28 !important;
        transform: translate(-50%, -50%);
        object-fit: contain;
        pointer-events: none;
    }

    body.tournament-wc2026 #wc-standings-header img {
        width: 48px !important;
        height: 48px !important;
        filter:
            drop-shadow(0 0 8px rgba(244,200,74,0.28))
            drop-shadow(0 0 16px rgba(31,231,255,0.16));
    }

    body.tournament-wc2026 #wc-standings-header .wc-trophy-table-bg {
        width: 65% !important;
        height: auto !important;
        opacity: 0.28 !important;
        top: 55% !important;
        filter: none;
    }

    body.tournament-wc2026 #wc-standings-header > img:not(.wc-trophy-table-bg),
    body.tournament-wc2026 #wc-standings-header > div {
        position: relative;
        z-index: 1;
    }

    body.tournament-wc2026 #wc-standings-header div div:first-child,
    body.tournament-wc2026 #wc-standings-header div div:last-child {
        font-family: var(--wc26-display, 'IBM Plex Sans Condensed', 'Inter', sans-serif);
        letter-spacing: 0 !important;
        text-shadow: 0 2px 10px rgba(0,0,0,0.30) !important;
    }

    body.tournament-wc2026 #wc-standings-header div div:first-child {
        color: var(--wc-text-primary) !important;
        font-size: 22px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
    }

    body.tournament-wc2026 #wc-standings-header div div:last-child {
        color: #d8ff22 !important;
        font-size: 14px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
    }

    @media (max-width: 430px) {
        body.tournament-wc2026 #wc-standings-header {
            min-height: 72px;
        }

        body.tournament-wc2026 #wc-standings-header div div:first-child {
            font-size: 20px !important;
        }

        body.tournament-wc2026 #wc-standings-header div div:last-child {
            font-size: 13px !important;
        }
    }
</style>

{% if current_tournament_name == 'ЧМ-2026' %}
<div id="wc-standings-header" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;">
    <img class="wc-trophy-table-bg" src="/static/clubs/WorldCup.png" alt="" aria-hidden="true">
    <img src="/static/clubs/WorldCup.png" style="width: 48px; height: 48px; opacity: 0.9;" alt="Кубок мира">
    <div style="text-align: left;">
        <div style="color: #ffffff; font-size: 20px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">Турнирная таблица</div>
        <div style="color: #ffffff; font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">чемпионата мира 2026</div>
    </div>
</div>
{% else %}
<div id="cup-standings-header" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;">
    <img src="/static/clubs/MatchTV.png" style="width: 48px; height: 48px; object-fit: contain; opacity: 0.9;" alt="MatchTV">
    <div style="text-align: left;">
        <div style="font-size: 20px; font-weight: 700; color: #1a1a2e;">Турнирная таблица</div>
        <div style="font-size: 16px; font-weight: 600; color: #1a1a2e;">кубка Матч-Премьер</div>
    </div>
</div>
{% endif %}

<div class="table-container">
    {% include "table_content.html" %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (window.location.pathname !== '/table') return;

    const tableContainer = document.querySelector('.table-container');

    function setTidOnLink(link, selectedTid) {
        if (!link || !selectedTid) return;

        const url = new URL(link.getAttribute('href') || '', window.location.origin);
        const syncedPaths = new Set(['/', '/table', '/profile']);

        if (!syncedPaths.has(url.pathname)) return;

        url.searchParams.set('tid', selectedTid);
        link.setAttribute('href', url.pathname + '?' + url.searchParams.toString() + url.hash);
    }

    function updateTournamentLinks(selectedTid) {
        if (!selectedTid) return;

        document.querySelectorAll('.bottom-nav a[href]').forEach(function(link) {
            setTidOnLink(link, selectedTid);
        });
    }

    async function loadTableByTid(tid) {
        if (!tableContainer || !tid) return;

        tableContainer.innerHTML = '<div style="text-align:center;padding:28px;color:#5d7894;font-weight:700;">Загрузка...</div>';

        try {
            const response = await fetch('/table?tid=' + encodeURIComponent(tid) + '&ajax=1', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            const data = await response.json();
            tableContainer.innerHTML = data.html || '';
            if (data.tid) {
                localStorage.setItem('selected_tid', String(data.tid));
            }
            if (data.tournament_name) {
                localStorage.setItem('selected_tournament_name', data.tournament_name);
            }

            const body = document.body;
            if (body) {
                body.classList.remove('tournament-cup', 'tournament-wc2026', 'tournament-rpl');
                if (data.tournament_key === 'wc2026') {
                    body.classList.add('tournament-wc2026');
                } else if (data.tournament_key === 'rpl') {
                    body.classList.add('tournament-rpl');
                } else {
                    body.classList.add('tournament-cup');
                }
            }

            const trigger = document.querySelector('.tournament-trigger');
            if (trigger && data.tournament_name) {
                trigger.textContent = '🏆 ' + data.tournament_name + ' ▼';
            }

            const wcHeader = document.getElementById('wc-standings-header');
            const cupHeader = document.getElementById('cup-standings-header');

            if (data.tournament_key === 'wc2026') {
                if (cupHeader) {
                    cupHeader.outerHTML = `
<div id="wc-standings-header" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;">
    <img class="wc-trophy-table-bg" src="/static/clubs/WorldCup.png" alt="" aria-hidden="true">
    <img src="/static/clubs/WorldCup.png" style="width: 48px; height: 48px; opacity: 0.9;" alt="Кубок мира">
    <div style="text-align: left;">
        <div style="color: #ffffff; font-size: 20px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">Турнирная таблица</div>
        <div style="color: #ffffff; font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">чемпионата мира 2026</div>
    </div>
</div>`;
                }
            } else {
                if (wcHeader) {
                    wcHeader.outerHTML = `
<div id="cup-standings-header" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px;">
    <img src="/static/clubs/MatchTV.png" style="width: 48px; height: 48px; object-fit: contain; opacity: 0.9;" alt="MatchTV">
    <div style="text-align: left;">
        <div style="font-size: 20px; font-weight: 700; color: #1a1a2e;">Турнирная таблица</div>
        <div style="font-size: 16px; font-weight: 600; color: #1a1a2e;">кубка Матч-Премьер</div>
    </div>
</div>`;
                }
            }

            const nextTid = data.tid || tid;
            history.pushState({ tid: nextTid }, '', '/table?tid=' + encodeURIComponent(nextTid));
            updateTournamentLinks(String(nextTid));

            document.querySelectorAll('.tournament-item').forEach(function(item) {
                const itemTid = item.getAttribute('data-tid')
                    || new URL(item.href, window.location.origin).searchParams.get('tid');
                item.classList.toggle('active', String(itemTid) === String(nextTid));
            });
        } catch (error) {
            console.error('Ошибка загрузки таблицы:', error);
            tableContainer.innerHTML = '<div style="text-align:center;padding:28px;color:#c62828;font-weight:700;">Ошибка загрузки. Обновите страницу.</div>';
        }
    }

    document.querySelectorAll('[data-ajax-table]').forEach(function(link) {
        link.addEventListener('click', function(e) {
            const href = link.getAttribute('href') || '';
            if (!href.includes('/table?tid=')) return;
            e.preventDefault();

            const parsed = new URL(href, window.location.origin);
            const tid = parsed.searchParams.get('tid');
            loadTableByTid(tid);

            const overlay = document.querySelector('[data-tournament-sheet-overlay]');
            const panel = document.querySelector('[data-tournament-sheet-panel]');
            if (overlay) overlay.classList.remove('open');
            if (panel) {
                panel.classList.remove('open');
                panel.setAttribute('aria-hidden', 'true');
            }
        });
    });
});
</script>

{% endblock %}
