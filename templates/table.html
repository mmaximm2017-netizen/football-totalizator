{% extends "base.html" %}
{% block content %}

<style>
    body.tournament-wc2026 .wc-trophy-table-bg {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80%;
        height: 80%;
        background-image: url('/static/clubs/WorldCup.png');
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.12;
        pointer-events: none;
        z-index: 0;
    }

    body.tournament-wc2026 .table-container {
        position: relative;
        z-index: 1;
    }

    body.tournament-wc2026 .standings-table {
        position: relative;
        z-index: 1;
    }
</style>

{% if current_tournament_name == 'ЧМ-2026' %}
<div class="wc-trophy-table-bg"></div>
{% endif %}

{% if current_tournament_name == 'ЧМ-2026' %}
<div style="text-align: center; margin-bottom: 16px;">
    <div id="standings-title-main" style="color: #ffffff; font-size: 20px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">Турнирная таблица</div>
    <div id="standings-title-sub" style="color: #ffffff; font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.3);">чемпионата мира 2026</div>
</div>
{% else %}
<h2 id="standings-title-main" style="text-align: center; margin-bottom: 16px;">🏆 Турнирная таблица</h2>
{% endif %}

<div class="table-container">
    {% include "table_content.html" %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    if (window.location.pathname !== '/table') return;

    const tableContainer = document.querySelector('.table-container');

    async function loadTableByTid(tid) {
        if (!tableContainer || !tid) return;

        tableContainer.innerHTML = '<div style="text-align:center;padding:28px;color:#5d7894;font-weight:700;">Загрузка...</div>';

        try {
            const response = await fetch('/table?tid=' + encodeURIComponent(tid) + '&ajax=1', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            const data = await response.json();
            tableContainer.innerHTML = data.html || '';

            const body = document.body;
            if (body) {
                if (data.tournament_key === 'wc2026') {
                    body.classList.remove('tournament-cup');
                    body.classList.add('tournament-wc2026');
                } else {
                    body.classList.remove('tournament-wc2026');
                    body.classList.add('tournament-cup');
                }
            }

            const trigger = document.querySelector('.tournament-trigger');
            if (trigger && data.tournament_name) {
                trigger.textContent = '🏆 ' + data.tournament_name + ' ▼';
            }

            const titleMain = document.getElementById('standings-title-main');
            const titleSub = document.getElementById('standings-title-sub');

            if (titleMain) {
                if (data.tournament_key === 'wc2026') {
                    titleMain.textContent = 'Турнирная таблица';
                    titleMain.style.color = '#ffffff';
                    titleMain.style.fontSize = '20px';
                    titleMain.style.fontWeight = '700';
                    titleMain.style.textShadow = '0 1px 2px rgba(0,0,0,0.3)';
                    titleMain.style.marginBottom = '';

                    if (titleSub) {
                        titleSub.textContent = 'чемпионата мира 2026';
                        titleSub.style.display = '';
                        titleSub.style.color = '#ffffff';
                        titleSub.style.fontSize = '16px';
                        titleSub.style.fontWeight = '600';
                        titleSub.style.textShadow = '0 1px 2px rgba(0,0,0,0.3)';
                    }
                } else {
                    titleMain.textContent = '🏆 Турнирная таблица';
                    titleMain.style.color = '';
                    titleMain.style.fontSize = '';
                    titleMain.style.fontWeight = '';
                    titleMain.style.textShadow = '';
                    titleMain.style.marginBottom = '16px';

                    if (titleSub) {
                        titleSub.style.display = 'none';
                    }
                }
            }

            const nextTid = data.tid || tid;
            history.pushState({ tid: nextTid }, '', '/table?tid=' + encodeURIComponent(nextTid));

            document.querySelectorAll('.tournament-item').forEach(function(item) {
                const href = item.getAttribute('href') || '';
                item.classList.toggle('active', href.includes('tid=' + nextTid));
            });
        } catch (error) {
            console.error('Ошибка загрузки таблицы:', error);
            tableContainer.innerHTML = '<div style="text-align:center;padding:28px;color:#c62828;font-weight:700;">Ошибка загрузки. Обновите страницу.</div>';
        }
    }

    document.querySelectorAll('[data-ajax-table]').forEach(function(link) {
        link.addEventListener('click', function(e) {
            const href = link.getAttribute('href') || '';
            if (!href.includes('/table?tid=')) return;
            e.preventDefault();

            const parsed = new URL(href, window.location.origin);
            const tid = parsed.searchParams.get('tid');
            loadTableByTid(tid);

            const overlay = document.querySelector('[data-tournament-sheet-overlay]');
            const panel = document.querySelector('[data-tournament-sheet-panel]');
            if (overlay) overlay.classList.remove('open');
            if (panel) {
                panel.classList.remove('open');
                panel.setAttribute('aria-hidden', 'true');
            }
        });
    });
});
</script>

{% endblock %}
