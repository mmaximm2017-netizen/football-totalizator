<div class="month-block">
    <button type="button" class="month-header-v2" aria-controls="month-content-{{ month_idx }}" aria-expanded="{{ 'true' if month_is_open else 'false' }}" onclick="toggleMonth('{{ month_idx }}', '{{ month.key }}')">
        <span class="month-left">
            <span id="arrow-month-{{ month_idx }}" class="month-arrow" {% if month_is_open %}style="transform: rotate(90deg);"{% endif %}>▶</span>
            <span class="month-title">{{ month.label }}</span>
        </span>

        <span class="month-count" data-match-count="{{ month.count }}"></span>
    </button>

    <div id="month-content-{{ month_idx }}" class="month-content" style="display: {% if month_is_open %}block{% else %}none{% endif %};">
        {% if month_is_open %}
        {% for day in month.days %}
        {% set day_idx = loop.index %}
        {% set day_is_open = day.key == open_day %}

        {% include 'partials/home/_day_block.html' %}

        {% endfor %}
        {% endif %}
    </div>
</div>
