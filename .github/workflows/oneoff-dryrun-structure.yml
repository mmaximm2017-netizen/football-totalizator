name: One-off dry-run structure probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .dryrun-structure-trigger

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect Sports Russia markers on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
            curl -4 -L --silent --show-error --compressed --max-time 20 -A 'Mozilla/5.0 (compatible; TOTISH-ReadOnly-Probe/1.0)' -o "$tmp" 'https://www.sports.ru/football/team/russia/calendar/2026/'
            python3 - "$tmp" <<'PY'
            import re,sys
            text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
            for marker in ('Окончен','Матч окончен','score-green','score-gray','data-match-status','matches-table','scores'):
                print(marker, text.casefold().count(marker.casefold()))
            for needle in ('Никарагуа','Мали','Тринидад'):
                pos=text.find(needle)
                if pos>=0:
                    print('RAW',needle,re.sub(r'\s+',' ',text[max(0,pos-1400):pos+2200])[:3600])
                    break
            PY
