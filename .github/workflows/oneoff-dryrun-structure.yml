name: One-off dry-run structure probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .dryrun-structure-trigger

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect eligible matches and source HTML on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ua='Mozilla/5.0 (compatible; TOTISH-ReadOnly-Probe/1.0)'
            for pair in \
              'livesport_rpl|https://www.livesport.ru/football/rfpl/calendar/' \
              'livesport_cup|https://www.livesport.ru/football/rucup/calendar/' \
              'sports_rpl|https://www.sports.ru/football/tournament/rfpl/calendar/' \
              'sports_russia|https://www.sports.ru/football/team/russia/calendar/2026/' \
              'matchtv_rpl|https://matchtv.ru/football/rpl/calendar/2026-27'; do
              name="${pair%%|*}"; url="${pair#*|}"
              echo "=== $name ==="
              tmp="$(mktemp)"
              set +e
              curl -4 -L --silent --show-error --compressed --max-time 20 -A "$ua" -o "$tmp" -w 'http=%{http_code} bytes=%{size_download} final=%{url_effective}\n' "$url"
              status=$?
              set -e
              echo "curl_exit=$status"
              if [[ -s "$tmp" ]]; then
                python3 - "$tmp" <<'PY'
            import re, sys
            from html import unescape
            p=sys.argv[1]
            text=open(p,encoding='utf-8',errors='replace').read()
            print('contains_ok_marker=', bool(re.search(r'>\s*Ок\s*<|\bОк\b', text)))
            classes=sorted(set(re.findall(r'class=["\']([^"\']+)["\']',text,re.I)))
            interesting=[c for c in classes if any(k in c.lower() for k in ('match','score','team','event','calendar','game'))]
            print('classes=', interesting[:60])
            plain=re.sub(r'(?is)<script.*?</script>|<style.*?</style>',' ',text)
            plain=re.sub(r'(?s)<[^>]+>',' ',plain)
            plain=re.sub(r'\s+',' ',unescape(plain))
            for needle in ('Акрон 2:2 ЦСКА','Акрон','Россия','Зенит'):
                pos=plain.find(needle)
                if pos>=0:
                    print('snippet',needle,plain[max(0,pos-180):pos+700])
                    break
            PY
              fi
              rm -f "$tmp"
            done
