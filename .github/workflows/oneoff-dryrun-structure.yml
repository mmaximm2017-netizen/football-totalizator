name: One-off dry-run structure probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .dryrun-structure-trigger

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Compare Sportbox match-center state on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ua='Mozilla/5.0 (compatible; TOTISH-ReadOnly-Probe/1.0)'
            for id in 1380956536 1380969525; do
              echo "=== game $id ==="
              tmp="$(mktemp)"
              curl -4 -L --silent --show-error --compressed --max-time 20 -A "$ua" -o "$tmp" "https://news.sportbox.ru/stats/game_json/$id"
              python3 - "$tmp" <<'PY'
            import json,sys,re
            raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
            print('bytes=',len(raw),'prefix=',raw[:300].replace('\n',' '))
            try:
                data=json.loads(raw)
            except Exception as e:
                print('json_error',e)
            else:
                print('type=',type(data).__name__)
                if isinstance(data,dict):
                    print('keys=',sorted(data)[:100])
                    for k,v in data.items():
                        if any(x in k.casefold() for x in ('status','state','live','score','time','finish','end')):
                            print(k,repr(v)[:1000])
            PY
              rm -f "$tmp"
            done
