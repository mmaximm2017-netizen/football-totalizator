name: One-off dry-run structure probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .dryrun-structure-trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_auto_result_worker_dry_run.py

  production-read-only:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Run branch worker against production in read-only mode
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            probe_dir="$(mktemp -d)"
            trap 'rm -rf "$probe_dir"' EXIT
            base='https://raw.githubusercontent.com/mmaximm2017-netizen/football-totalizator/prototype/auto-result-sources/scripts'
            curl -fsSL "$base/auto_result_sources.py" -o "$probe_dir/auto_result_sources.py"
            curl -fsSL "$base/auto_result_worker.py" -o "$probe_dir/auto_result_worker.py"
            cd /opt/football-totalizator
            if [[ -z "${TOTISH_IMAGE:-}" ]]; then
              TOTISH_IMAGE="$(docker inspect --format='{{.Config.Image}}' football-totalizator-app-1)"
              export TOTISH_IMAGE
            fi
            echo '=== current production dry-run ==='
            docker compose run --rm -T --interactive=false \
              -e AUTO_RESULTS_ENABLED=true -e AUTO_RESULTS_DRY_RUN=true \
              -v "$probe_dir:/probe:ro" \
              app python /probe/auto_result_worker.py --state-file /tmp/auto-results-test-state.json --no-notify

            echo '=== historical source assertions from production IP ==='
            docker compose run --rm -T --interactive=false \
              -v "$probe_dir:/probe:ro" \
              app python - <<'PY'
            import sys
            sys.path.insert(0, '/probe')
            from auto_result_sources import *

            live_rpl = fetch_text('https://www.livesport.ru/football/rfpl/calendar/')
            sports_rpl = fetch_text('https://www.sports.ru/football/tournament/rfpl/calendar/')
            a = find_livesport_result(live_rpl, home='Акрон', away='ЦСКА', match_date='2026-08-28')
            b = find_sports_rpl_result(sports_rpl, home='Акрон', away='ЦСКА', match_date='2026-08-28')
            assert a.status == b.status == STATUS_FINISHED, (a, b)
            assert (a.home_score, a.away_score) == (2,2), a
            assert (b.home_score, b.away_score) == (2,2), b
            print('RPL_OK', a, b)

            live_cup = fetch_text('https://www.livesport.ru/football/rucup/calendar/')
            a = find_livesport_result(live_cup, home='Локомотив', away='ЦСКА', match_date='2026-08-04')
            assert a.status == STATUS_FINISHED and (a.home_score,a.away_score)==(1,1), a
            rfs_html = fetch_text('https://www.rfs.ru/cup/tournament/matches?TournamentMatchesFilter%5Bdate%5D=all')
            candidates = rfs_cup_candidates(rfs_html)
            cand = find_rfs_candidate(candidates, home='Локомотив', away='ЦСКА')
            assert cand and cand['score'] == (1,1), cand
            detail = fetch_text(absolute_url('https://www.rfs.ru', cand['href']))
            b = parse_rfs_finished_detail(detail, score=cand['score'])
            assert b.status == STATUS_FINISHED and b.match_date == '2026-08-04', b
            print('CUP_OK', a, b)

            sb_html = fetch_text('https://news.sportbox.ru/Vidy_sporta/Futbol/russian_team')
            sb_candidates = sportbox_national_candidates(sb_html)
            cand = find_sportbox_candidate(sb_candidates, home='Россия', away='Тринидад и Тобаго', match_date='2026-06-09')
            assert cand, sb_candidates
            a = parse_sportbox_game_json(fetch_text(f"https://news.sportbox.ru/stats/game_json/{cand['game_id']}"), match_date='2026-06-09')
            rfs_html = fetch_text('https://www.rfs.ru/natteamfriendlies/calendar')
            candidates = rfs_national_candidates(rfs_html)
            cand2 = find_rfs_candidate(candidates, home='Россия', away='Тринидад и Тобаго', match_date='2026-06-09')
            assert cand2 and cand2['score'] == (3,0), cand2
            b = parse_rfs_finished_detail(fetch_text(absolute_url('https://www.rfs.ru', cand2['href'])), score=cand2['score'])
            assert a.status == b.status == STATUS_FINISHED, (a,b)
            assert (a.home_score,a.away_score) == (b.home_score,b.away_score) == (3,0), (a,b)
            print('NATIONAL_OK', a, b)
            PY
