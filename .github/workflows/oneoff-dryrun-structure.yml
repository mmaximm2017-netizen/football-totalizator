name: One-off dry-run structure probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .dryrun-structure-trigger

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Inspect completion markers on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ua='Mozilla/5.0 (compatible; TOTISH-ReadOnly-Probe/1.0)'
            for pair in \
              'sports|https://www.sports.ru/football/tournament/rfpl/calendar/' \
              'matchtv|https://matchtv.ru/football/rpl/calendar/2026-27'; do
              name="${pair%%|*}"; url="${pair#*|}"
              tmp="$(mktemp)"
              curl -4 -L --silent --show-error --compressed --max-time 20 -A "$ua" -o "$tmp" "$url"
              echo "=== $name markers ==="
              python3 - "$tmp" <<'PY'
            import re, sys
            text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
            for marker in ('calendar-status__moment','calendar-card__status','view-type-disabled','future-time','Окончен','Заверш','Матч завершен','Матч окончен'):
                print(marker, text.casefold().count(marker.casefold()))
            for marker in ('calendar-status__moment','view-type-disabled'):
                pos=text.find(marker)
                if pos>=0:
                    snippet=re.sub(r'\s+',' ',text[max(0,pos-900):pos+1800])
                    print('RAW',marker,snippet[:2700])
            PY
              rm -f "$tmp"
            done
