name: Diagnose wake sources
on:
  push:
    branches: [ops/neon-emergency-budget]
    paths: [.github/workflows/diagnose-gate.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            /usr/bin/python3 - <<'PY'
            import json,re,subprocess,datetime
            from pathlib import Path
            def run(args): return subprocess.run(args,capture_output=True,text=True,timeout=25)
            r=run(['docker','events','--since','2026-09-16T04:43:00Z','--until','2026-09-16T10:33:00Z','--filter','type=container','--format','{{json .}}'])
            for line in r.stdout.splitlines():
                try: d=json.loads(line)
                except ValueError: continue
                if d.get('Action') not in ('create','start','die'): continue
                a=d.get('Actor',{}).get('Attributes',{})
                name=a.get('name','')
                if 'football-totalizator' not in name: continue
                print('CONTAINER_EVENT',datetime.datetime.fromtimestamp(d['time'],datetime.timezone.utc).isoformat(),d.get('Action'),name,a.get('com.docker.compose.service'),a.get('exitCode'))
            r=run(['docker','logs','--timestamps','--since','2026-09-16T04:43:00Z','--until','2026-09-16T10:33:00Z','--tail','15000','football-totalizator-app-1'])
            wakes=['04:57:41','05:37:55','05:45:04','06:08:44','06:36:04','06:47:04','06:55:31','07:14:24','07:50:04','08:01:06','08:23:00','09:51:52','10:27:21']
            times={s:datetime.datetime.fromisoformat('2026-09-16T'+s+'+00:00').timestamp() for s in wakes}
            for line in (r.stdout+r.stderr).splitlines():
                try: t=datetime.datetime.fromisoformat(line.split(' ',1)[0].replace('Z','+00:00')).timestamp()
                except ValueError: continue
                near=[s for s,v in times.items() if -15<=t-v<=30]
                if not near: continue
                fields={}
                for k in ('method','path','session_cookie_present','session_user_id_present'):
                    m=re.search(r'\b'+k+r'=([^ ]+)',line)
                    if m:
                        v=m[1].split('?')[0]
                        if re.fullmatch(r'[A-Za-z0-9_/.-]{1,120}',v): fields[k]=v
                if fields: print('APP_REQUEST',near[0],int(t-times[near[0]]),json.dumps(fields))
            r=run(['sudo','-n','/usr/bin/tail','-n','10000','/var/log/nginx/access.log'])
            for label in ('04:57:41','05:37:55','05:45:04','06:55:31','07:50:04','08:23:00','10:27:21'):
                for line in r.stdout.splitlines():
                    m=re.search(r'\[([^]]+)\] "([A-Z]+) ([^ ]+) HTTP/[^"]+" (\d+) \S+ "([^"]*)" "([^"]*)"',line)
                    if not m: continue
                    t=datetime.datetime.strptime(m[1],'%d/%b/%Y:%H:%M:%S %z').timestamp()
                    if not -90<=t-times[label]<=90: continue
                    path=m[3].split('?')[0]
                    if path=='/health' or path.startswith('/static/'): continue
                    if not re.fullmatch(r'/[A-Za-z0-9_./-]{0,80}',path): path='[redacted]'
                    ua=m[6].lower()
                    kind=next((k for k in ('chatgpt-user','oai-searchbot','gptbot','googlebot','bingbot','yandex','curl','python','headless','bot') if k in ua),'android' if 'android' in ua else 'browser' if 'mozilla' in ua else 'other')
                    print('WIDER_HTTP',label,int(t-times[label]),path,m[2],m[4],kind)
            
            PY
