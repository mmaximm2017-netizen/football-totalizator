name: Diagnose production gate
on:
  push:
    branches: [ops/neon-emergency-budget]
    paths: [.github/workflows/diagnose-gate.yml]
permissions: {}
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Inspect local cron and gate without database access
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            /usr/bin/python3 - <<'PY'
            import json, re, subprocess, sys, time
            from pathlib import Path
            sys.path.insert(0, str(Path.cwd() / 'scripts'))
            import db_activity_gate as gate
            root = Path.home() / '.local/state/totish'
            state = root / 'db-activity-gate.json'
            plan = gate.load_plan(state)
            print('HOST_TIME', int(time.time()))
            import getpass, shutil, socket
            print('SSH_IDENTITY',getpass.getuser(),socket.gethostname())
            print('COMMAND_PATHS',json.dumps({x:shutil.which(x) for x in ('sudo','crontab','tail')}))
            try:
                s=Path('/etc/sudoers.d/totish-neon-readonly').stat()
                print('SUDOERS_FILE',s.st_uid,oct(s.st_mode & 0o777))
            except OSError as e: print('SUDOERS_FILE_ERROR',type(e).__name__)
            for command in (['sudo','-n','/usr/bin/crontab','-l'],['sudo','-n','/usr/bin/tail','-n','10000','/var/log/nginx/access.log']):
                r=subprocess.run(command,capture_output=True,text=True,timeout=10)
                print('EXACT_READ_PROBE',command[2],r.returncode,repr(r.stderr[:500]))
            print('GATE_PLAN', json.dumps({k: plan.get(k) for k in ('generated_at','active','active_until','next_due')} if plan else None))
            print('GATE_MONITOR_DECISION', gate.monitor_due(state, root / 'production-monitor-recovery.json'))
            def summarize(label, data):
                for line in data.splitlines():
                    line=line.strip()
                    if not line or line.startswith('#'): continue
                    parts=line.split()
                    if len(parts)<6 or not re.fullmatch(r'[0-9*,/@A-Za-z-]+', parts[0]): continue
                    names=re.findall(r'[A-Za-z0-9_.-]+\.(?:sh|py)\b', line)
                    print('CRON',label,' '.join(parts[:5]),'scripts='+','.join(names),'tools='+','.join(re.findall(r'(?<![A-Za-z_])(?:curl|wget|docker|python3?|psql|pg_dump|pg_restore|run-parts|systemctl|bash|sh)(?![A-Za-z_])',line)),'db_health='+str('/health/db' in line))
            for label, command in [('user',['crontab','-l']),('root',['sudo','-n','crontab','-l'])]:
                r=subprocess.run(command,capture_output=True,text=True,timeout=10)
                print('CRON_READ', label, r.returncode)
                if r.returncode==0: summarize(label,r.stdout)
            for p in [Path('/etc/crontab'),*Path('/etc/cron.d').glob('*')]:
                if p.is_file():
                    try: summarize(p.name,p.read_text())
                    except OSError: print('CRON_UNREADABLE',p.name)
            r=subprocess.run(['systemctl','list-timers','--all','--no-pager','--no-legend'],capture_output=True,text=True,timeout=10)
            for line in r.stdout.splitlines():
                print('TIMER_UNITS',','.join(re.findall(r'[A-Za-z0-9@_.-]+\.(?:timer|service)',line)))
            r=subprocess.run(['docker','ps','--format','{{.Names}}'],capture_output=True,text=True,timeout=10)
            print('CONTAINERS',r.stdout.strip())
            path=root/'auto-results.log'
            if path.exists():
                with path.open('rb') as f:
                    f.seek(max(0,path.stat().st_size-8192))
                    lines=f.read().decode(errors='replace').splitlines()
                for line in lines[-30:]:
                    if re.fullmatch(r'[\dT:+-]+ (START auto-result runtime|FINISH auto-result runtime exit_code=\d+|SKIP overlapping run)',line): print('WORKER_MARKER',line)
            r=subprocess.run(['sudo','-n','crontab','-l'],capture_output=True,text=True,timeout=10)
            err=r.stderr.lower()
            print('ROOT_CRON_RESULT', 'present' if r.returncode==0 else ('absent' if 'no crontab' in err else 'access_unavailable'))
            from collections import Counter
            import datetime
            routes=('/health','/health/db','/api/gpt/query','/api/gpt/schema','/api/gpt/health','/')
            for filename in ('/var/log/nginx/access.log','/var/log/nginx/totish.access.log'):
                r=subprocess.run(['sudo','-n','tail','-n','10000',filename],capture_output=True,text=True,timeout=10)
                if r.returncode:
                    r=subprocess.run(['tail','-n','10000',filename],capture_output=True,text=True,timeout=10)
                print('ACCESS_LOG_READ',Path(filename).name,r.returncode)
                if r.returncode: continue
                counts=Counter()
                buckets=Counter()
                latest={}
                cutoff=time.time()-3600
                for line in r.stdout.splitlines():
                    match=re.search(r'\[([^]]+)\].*?"([A-Z]+) ([^ ]+) HTTP/',line)
                    if not match: continue
                    try: stamp=datetime.datetime.strptime(match[1],'%d/%b/%Y:%H:%M:%S %z').timestamp()
                    except ValueError: continue
                    if stamp<cutoff: continue
                    path=match[3].split('?')[0]
                    route=path if path in routes else 'other'
                    counts[route]+=1
                    buckets[(int(stamp)//300*300,route)]+=1
                    latest[route]=max(stamp,latest.get(route,0))
                print('ACCESS_LAST_HOUR_COUNTS',json.dumps(dict(counts),sort_keys=True))
                print('ACCESS_LAST_TIMES',json.dumps(latest,sort_keys=True))
                print('ACCESS_5MIN_BUCKETS',json.dumps([(stamp,route,count) for (stamp,route),count in sorted(buckets.items())]))
            r=subprocess.run(['docker','logs','--since','1h','--tail','3000','football-totalizator-app-1'],capture_output=True,text=True,timeout=15)
            data=r.stdout+r.stderr
            print('APP_LOG_MARKERS',json.dumps({name:data.count(name) for name in ('/api/gpt/query','/health/db','DB pool initialized','Dead pool connection discarded','PoolExhausted')}))
            PY
