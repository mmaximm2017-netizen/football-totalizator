name: Diagnose production gate

on:
  push:
    branches: [ops/neon-emergency-budget]
    paths: [.github/workflows/diagnose-gate.yml]

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Read local gate state and bounded operational markers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            /usr/bin/python3 - <<'PY'
            import json, os, re, sys, time
            from pathlib import Path
            sys.path.insert(0, str(Path.cwd() / 'scripts'))
            import db_activity_gate as gate
            root = Path.home() / '.local/state/totish'
            state = root / 'db-activity-gate.json'
            plan = gate.load_plan(state)
            print('GATE_HOST_TIME', int(time.time()))
            print('GATE_STATE_OVERRIDE', bool(os.getenv('TOTISH_STATE_DIR')))
            print('GATE_PLAN', json.dumps({k: plan.get(k) for k in ('generated_at', 'active', 'active_until', 'next_due')} if plan else None))
            print('GATE_REFRESH_DECISION', gate.refresh_due(state))
            print('GATE_WORKER_DECISION', gate.should_run(state))
            print('GATE_MONITOR_DECISION', gate.monitor_due(state, root / 'production-monitor-recovery.json'))
            for name in ('db-activity-gate.log', 'auto-results.log'):
                path = root / name
                if not path.exists():
                    print('LOG_MISSING', name)
                    continue
                with path.open('rb') as f:
                    f.seek(max(0, path.stat().st_size - 8192))
                    lines = f.read().decode('utf-8', errors='replace').splitlines()
                for line in lines[-30:]:
                    if re.fullmatch(r'DB_ACTIVITY_GATE_REFRESH_FAILED exit_code=\d+; previous plan retained', line) or re.fullmatch(r'[\dT:+-]+ (START auto-result runtime|FINISH auto-result runtime exit_code=\d+|SKIP overlapping run)', line):
                        print(name, line)
            PY
