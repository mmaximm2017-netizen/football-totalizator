name: One-off runtime mojibake cleanup

on:
  push:
    branches:
      - fix/runtime-mojibake-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-mojibake-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rewrite legacy runtime text
        run: python scripts/oneoff_fix_mojibake.py
      - name: Commit cleanup
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No runtime changes produced"
            exit 1
          fi
          git commit -m "Remove runtime mojibake and legacy fallbacks"
          git push origin HEAD:fix/runtime-mojibake-cleanup
