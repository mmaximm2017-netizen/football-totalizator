name: One-off alternative result source probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .alternative-source-trigger

concurrency:
  group: alternative-result-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Probe alternatives from production VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            ua='Mozilla/5.0 (compatible; TOTISH-ReadOnly-Probe/1.0)'
            urls=(
              'https://www.sports.ru/football/tournament/rfpl/calendar/'
              'https://www.championat.com/football/_russiapl/tournament/7096/calendar/'
              'https://matchtv.ru/football/rpl/calendar/2026-27'
              'https://www.sports.ru/football/tournament/russian-cup/calendar/'
              'https://www.championat.com/football/_russiacup/tournament/7094/calendar/'
              'https://www.championat.com/football/_russia/tournament/6894/teams/276074/result/'
            )
            for url in "${urls[@]}"; do
              echo "=== $url ==="
              tmp="$(mktemp)"
              set +e
              curl -4 -L --silent --show-error --compressed --max-time 20 -A "$ua" -o "$tmp" -w 'http=%{http_code} bytes=%{size_download} time=%{time_total} final=%{url_effective}\n' "$url"
              status=$?
              set -e
              echo "curl_exit=$status"
              if [[ -s "$tmp" ]]; then
                grep -qi 'captcha\|не робот\|access denied\|доступ ограничен' "$tmp" && echo 'block_marker=true' || echo 'block_marker=false'
                grep -qi 'Краснодар\|Зенит\|Россия' "$tmp" && echo 'football_marker=true' || echo 'football_marker=false'
                grep -Eq '[0-9][[:space:]]*:[[:space:]]*[0-9]' "$tmp" && echo 'score_marker=true' || echo 'score_marker=false'
              fi
              rm -f "$tmp"
            done
