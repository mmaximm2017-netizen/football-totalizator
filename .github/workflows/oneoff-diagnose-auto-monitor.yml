name: One-off diagnose auto monitor

on:
  push:
    branches:
      - audit/post-pr60-production
    paths:
      - .audit-auto-monitor-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Diagnose production auto-results monitor
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            echo '=== UTC ==='
            date -u -Is
            echo '=== MONITOR LOG 06:10..06:25 ==='
            grep -E '2026-09-05T06:(1[0-9]|2[0-5])|auto_results:monitor_failed|MONITOR:' "$HOME/.local/state/totish/production-monitor.log" | tail -n 160 || true
            echo '=== AUTO RESULT LOG 06:10..06:25 ==='
            grep -E '2026-09-05T06:(1[0-9]|2[0-5])|START auto-result|FINISH auto-result|monitor|AUTO_RESULTS_' "$HOME/.local/state/totish/auto-results.log" | tail -n 220 || true
            echo '=== PROCESSES ==='
            ps -ef | grep -E 'run_auto_results|auto_result_runtime|monitor_production' | grep -v grep || true
            echo '=== CRON ==='
            crontab -l | grep -E 'monitor_production|run_auto_results' || true
