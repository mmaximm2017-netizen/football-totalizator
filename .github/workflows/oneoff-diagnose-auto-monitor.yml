name: One-off diagnose auto monitor

on:
  push:
    branches:
      - audit/post-pr60-production
    paths:
      - .audit-auto-monitor-trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Verify production monitor after PR61
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            echo '=== RELEASE ==='
            echo "managed=$(cat .totish-managed-release)"
            echo "image=$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
            echo "health=$(docker inspect football-totalizator-app-1 --format '{{.State.Running}}|{{.State.Health.Status}}')"
            echo '=== EXACT CRON-STYLE MONITOR ==='
            set +e
            /usr/bin/python3 scripts/monitor_production.py
            monitor_status=$?
            set -e
            echo "monitor_status=$monitor_status"
            echo '=== AUTO RESULT LOG TAIL ==='
            tail -n 60 "$HOME/.local/state/totish/auto-results.log" || true
            echo '=== PRODUCTION MONITOR LOG TAIL ==='
            tail -n 80 "$HOME/.local/state/totish/production-monitor.log" || true
            exit "$monitor_status"
