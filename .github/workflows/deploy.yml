name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_reference:
        description: Full GHCR image reference with sha256 digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Download published image reference
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: production-image-reference
          path: image-reference
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Select immutable image reference
        id: image
        env:
          MANUAL_IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            image_reference="$MANUAL_IMAGE_REFERENCE"
          else
            image_reference="$(<image-reference/image-reference.txt)"
          fi
          [[ "$image_reference" =~ ^ghcr\.io/mmaximm2017-netizen/football-totalizator@sha256:[0-9a-f]{64}$ ]]
          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            expected_image="${{ steps.image.outputs.reference }}"
            previous_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"

            if [[ ! "$previous_image" =~ ^ghcr\.io/mmaximm2017-netizen/football-totalizator@sha256:[0-9a-f]{64}$ ]]; then
              echo "DEPLOY REFUSED: current image is not a rollback-safe immutable reference" >&2
              exit 1
            fi

            verify_health() {
              local attempt
              for attempt in {1..30}; do
                if curl --fail --silent --show-error --max-time 5 \
                  http://127.0.0.1:8000/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            restore_previous() {
              echo "WORKFLOW ROLLBACK: restoring $previous_image" >&2
              export TOTISH_IMAGE="$previous_image"
              docker compose pull app
              docker compose up -d --force-recreate app

              running_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
              if [[ "$running_image" != "$previous_image" ]]; then
                echo "WORKFLOW ROLLBACK FAILED: wrong image is running" >&2
                return 1
              fi

              if ! verify_health; then
                echo "WORKFLOW ROLLBACK FAILED: previous version is unhealthy" >&2
                return 1
              fi

              echo "WORKFLOW ROLLBACK OK: $previous_image"
            }

            echo "PRE-DEPLOY: pulling target image"
            export TOTISH_IMAGE="$expected_image"
            docker compose pull app

            echo "PRE-DEPLOY: applying versioned database migrations"
            docker compose run --rm --no-deps --entrypoint python app scripts/run_migrations.py

            set +e
            ./scripts/deploy_production.sh "$expected_image"
            deploy_status=$?
            set -e

            if (( deploy_status != 0 )); then
              running_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}' 2>/dev/null || true)"
              if [[ "$running_image" != "$previous_image" ]] || ! verify_health; then
                restore_previous || {
                  echo "DEPLOY FAILED AND AUTOMATIC ROLLBACK FAILED" >&2
                  exit 1
                }
              else
                echo "ROLLBACK VERIFIED: previous version is running and healthy"
              fi
              exit "$deploy_status"
            fi

            current_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
            if [[ "$current_image" != "$expected_image" ]]; then
              echo "DEPLOY VERIFICATION FAILED: expected image is not running" >&2
              restore_previous || true
              exit 1
            fi

            if ! verify_health; then
              echo "DEPLOY VERIFICATION FAILED: new version is unhealthy" >&2
              restore_previous || true
              exit 1
            fi

            rollback_holder="totish-rollback-image"
            docker rm -f "$rollback_holder" >/dev/null 2>&1 || true

            if docker create --name "$rollback_holder" --entrypoint /bin/true "$previous_image" >/dev/null; then
              echo "ROLLBACK_IMAGE_RETAINED: $previous_image"
            else
              echo "POST_DEPLOY_CLEANUP_SKIPPED: failed to retain previous image" >&2
              exit 0
            fi

            repo="ghcr.io/mmaximm2017-netizen/football-totalizator"
            mapfile -t image_ids < <(
              docker image ls --no-trunc --format '{{.Repository}} {{.ID}}' |
              awk -v repo="$repo" '$1 == repo {print $2}' |
              sort -u
            )

            removed=0
            for image_id in "${image_ids[@]}"; do
              [[ -n "$image_id" ]] || continue
              if docker ps -aq --filter "ancestor=$image_id" | grep -q .; then
                continue
              fi
              if docker image rm -f "$image_id" >/dev/null 2>&1; then
                removed=$((removed + 1))
              fi
            done

            docker builder prune --all --force >/dev/null
            echo "POST_DEPLOY_CLEANUP_OK: removed_unused_totish_images=$removed"
