name: Deploy production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_reference:
        description: Full GHCR image reference with sha256 digest
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    name: Deploy production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Download published image reference
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: production-image-reference
          path: image-reference
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Select immutable image reference
        id: image
        env:
          MANUAL_IMAGE_REFERENCE: ${{ inputs.image_reference }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            image_reference="$MANUAL_IMAGE_REFERENCE"
          else
            image_reference="$(<image-reference/image-reference.txt)"
          fi
          [[ "$image_reference" =~ ^ghcr\.io/mmaximm2017-netizen/football-totalizator@sha256:[0-9a-f]{64}$ ]]
          echo "reference=$image_reference" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            expected_image="${{ steps.image.outputs.reference }}"
            previous_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"

            if [[ ! "$previous_image" =~ ^ghcr\.io/mmaximm2017-netizen/football-totalizator@sha256:[0-9a-f]{64}$ ]]; then
              echo "DEPLOY REFUSED: current image is not a rollback-safe immutable reference" >&2
              exit 1
            fi

            verify_health() {
              local attempt
              for attempt in {1..30}; do
                if curl --fail --silent --show-error --max-time 5 \
                  http://127.0.0.1:8000/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                  return 0
                fi
                sleep 2
              done
              return 1
            }

            restore_previous() {
              echo "WORKFLOW ROLLBACK: restoring $previous_image" >&2
              export TOTISH_IMAGE="$previous_image"
              docker compose pull app
              docker compose up -d --force-recreate app

              running_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
              if [[ "$running_image" != "$previous_image" ]]; then
                echo "WORKFLOW ROLLBACK FAILED: wrong image is running" >&2
                return 1
              fi

              if ! verify_health; then
                echo "WORKFLOW ROLLBACK FAILED: previous version is unhealthy" >&2
                return 1
              fi

              echo "WORKFLOW ROLLBACK OK: $previous_image"
            }

            echo "PRE-DEPLOY: pulling target image"
            docker pull "$expected_image" >/dev/null

            release_sha="$(
              docker image inspect "$expected_image" --format '{{range .Config.Env}}{{println .}}{{end}}' |
              sed -n 's/^TOTISH_RELEASE=//p' |
              head -n 1
            )"
            if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "DEPLOY REFUSED: target image does not contain a valid TOTISH_RELEASE" >&2
              exit 1
            fi
            echo "TARGET RELEASE: $release_sha"

            git fetch --quiet origin "$release_sha"

            bootstrap_backup="$(mktemp -d)"
            cp docker-compose.yml "$bootstrap_backup/docker-compose.yml"
            cp scripts/deploy_production.sh "$bootstrap_backup/deploy_production.sh"

            git show "$release_sha:docker-compose.yml" > docker-compose.yml.tmp
            mv docker-compose.yml.tmp docker-compose.yml
            git show "$release_sha:scripts/deploy_production.sh" > scripts/deploy_production.sh.tmp
            chmod 755 scripts/deploy_production.sh.tmp
            mv scripts/deploy_production.sh.tmp scripts/deploy_production.sh

            export TOTISH_IMAGE="$expected_image"

            echo "PRE-DEPLOY: applying versioned database migrations"
            docker compose run --rm --no-deps --entrypoint python app scripts/run_migrations.py

            set +e
            ./scripts/deploy_production.sh "$expected_image"
            deploy_status=$?
            set -e

            if (( deploy_status != 0 )); then
              cp "$bootstrap_backup/docker-compose.yml" docker-compose.yml
              cp "$bootstrap_backup/deploy_production.sh" scripts/deploy_production.sh
              chmod 755 scripts/deploy_production.sh

              running_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}' 2>/dev/null || true)"
              if [[ "$running_image" != "$previous_image" ]] || ! verify_health; then
                restore_previous || {
                  echo "DEPLOY FAILED AND AUTOMATIC ROLLBACK FAILED" >&2
                  exit 1
                }
              else
                echo "ROLLBACK VERIFIED: previous version is running and healthy"
              fi
              exit "$deploy_status"
            fi

            current_image="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
            if [[ "$current_image" != "$expected_image" ]]; then
              cp "$bootstrap_backup/docker-compose.yml" docker-compose.yml
              cp "$bootstrap_backup/deploy_production.sh" scripts/deploy_production.sh
              chmod 755 scripts/deploy_production.sh
              echo "DEPLOY VERIFICATION FAILED: expected image is not running" >&2
              restore_previous || true
              exit 1
            fi

            if ! verify_health; then
              cp "$bootstrap_backup/docker-compose.yml" docker-compose.yml
              cp "$bootstrap_backup/deploy_production.sh" scripts/deploy_production.sh
              chmod 755 scripts/deploy_production.sh
              echo "DEPLOY VERIFICATION FAILED: new version is unhealthy" >&2
              restore_previous || true
              exit 1
            fi

            echo "CONTROL PLANE SYNC: installing production-managed files from $release_sha"
            manifest="$(git show "$release_sha:deploy/production-managed-files.txt")"
            control_backup="$(mktemp -d)"
            crontab -l > "$control_backup/crontab" 2>/dev/null || true

            sync_ok=1
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              [[ "$path" == \#* ]] && continue

              mkdir -p "$(dirname "$path")"

              if [[ -f "$path" ]]; then
                mkdir -p "$control_backup/files/$(dirname "$path")"
                cp "$path" "$control_backup/files/$path"
              fi

              if ! git show "$release_sha:$path" > "$path.tmp"; then
                sync_ok=0
                rm -f "$path.tmp"
                break
              fi

              case "$path" in
                scripts/*.sh|scripts/*.py)
                  chmod 755 "$path.tmp"
                  ;;
                *)
                  chmod 644 "$path.tmp"
                  ;;
              esac
              mv "$path.tmp" "$path"
            done <<< "$manifest"

            if (( sync_ok )); then
              cron_tmp="$(mktemp)"
              crontab -l 2>/dev/null |
                awk '
                  BEGIN { skip=0 }
                  /^# BEGIN TOTISH MANAGED$/ { skip=1; next }
                  /^# END TOTISH MANAGED$/ { skip=0; next }
                  skip { next }
                  /\/opt\/football-totalizator/ &&
                  /(host_telegram_notifier\.py|monitor_production\.py|run_morning_digest\.sh|run_deadline_pushes\.sh|run_match_result_pushes\.sh)/ { next }
                  { print }
                ' > "$cron_tmp" || true

              {
                cat "$cron_tmp"
                echo "# BEGIN TOTISH MANAGED"
                cat deploy/production.cron
                echo "# END TOTISH MANAGED"
              } | crontab - || sync_ok=0
              rm -f "$cron_tmp"
            fi

            if (( ! sync_ok )); then
              echo "CONTROL PLANE SYNC FAILED: restoring previous host files" >&2
              if [[ -d "$control_backup/files" ]]; then
                while IFS= read -r backup_path; do
                  relative="${backup_path#"$control_backup/files/"}"
                  cp "$backup_path" "$relative"
                done < <(find "$control_backup/files" -type f)
              fi
              if [[ -s "$control_backup/crontab" ]]; then
                crontab "$control_backup/crontab" || true
              fi
              restore_previous || true
              exit 1
            fi

            printf '%s\n' "$release_sha" > .totish-managed-release.tmp
            mv .totish-managed-release.tmp .totish-managed-release
            chmod 644 .totish-managed-release
            echo "CONTROL PLANE SYNC OK: $release_sha"

            rollback_holder="totish-rollback-image"
            docker rm -f "$rollback_holder" >/dev/null 2>&1 || true

            if docker create --name "$rollback_holder" --entrypoint /bin/true "$previous_image" >/dev/null; then
              echo "ROLLBACK_IMAGE_RETAINED: $previous_image"
            else
              echo "POST_DEPLOY_CLEANUP_SKIPPED: failed to retain previous image" >&2
              exit 0
            fi

            repo="ghcr.io/mmaximm2017-netizen/football-totalizator"
            mapfile -t image_ids < <(
              docker image ls --no-trunc --format '{{.Repository}} {{.ID}}' |
              awk -v repo="$repo" '$1 == repo {print $2}' |
              sort -u
            )

            removed=0
            for image_id in "${image_ids[@]}"; do
              [[ -n "$image_id" ]] || continue
              if docker ps -aq --filter "ancestor=$image_id" | grep -q .; then
                continue
              fi
              if docker image rm -f "$image_id" >/dev/null 2>&1; then
                removed=$((removed + 1))
              fi
            done

            docker builder prune --all --force >/dev/null
            echo "POST_DEPLOY_CLEANUP_OK: removed_unused_totish_images=$removed"
