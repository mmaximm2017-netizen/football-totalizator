name: One-off enable auto-results dry-run

on:
  push:
    branches:
      - ops/enable-auto-result-dry-run
    paths:
      - .activate-auto-results-trigger

jobs:
  enable:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Final production dry-run verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd /opt/football-totalizator

            # Remove only the temporary pre-managed cron line from the failed activation attempt.
            temp_line='*/5 * * * * /bin/bash /opt/football-totalizator/scripts/run_auto_results.sh'
            crontab -l 2>/dev/null | grep -Fvx "$temp_line" | crontab -

            echo '=== runtime files ==='
            test -f scripts/run_auto_results.sh
            test -f scripts/auto_result_worker.py
            test -f scripts/auto_result_sources.py
            grep '^AUTO_RESULTS_ENABLED=true$' .env
            grep '^AUTO_RESULTS_DRY_RUN=true$' .env
            test "$(crontab -l | grep -c 'run_auto_results.sh')" -eq 1
            crontab -l | grep 'run_auto_results.sh'

            echo '=== before ==='
            docker exec -i football-totalizator-app-1 python - <<'PY'
            from app.db import get_db, close_db
            conn=get_db(); cur=conn.cursor()
            try:
                cur.execute("SELECT id, status, home_score, away_score FROM matches WHERE id=401")
                print('MATCH401_BEFORE', cur.fetchone())
            finally:
                close_db(conn,cur)
            PY

            echo '=== manual dry-run ==='
            TOTISH_AUTO_RESULTS_LOG="$HOME/.local/state/totish/auto-results.log" \
            TOTISH_AUTO_RESULTS_LOCK="$HOME/.local/state/totish/auto-results.lock" \
            /bin/bash scripts/run_auto_results.sh
            tail -n 20 "$HOME/.local/state/totish/auto-results.log"

            echo '=== after ==='
            docker exec -i football-totalizator-app-1 python - <<'PY'
            from app.db import get_db, close_db
            conn=get_db(); cur=conn.cursor()
            try:
                cur.execute("SELECT id, status, home_score, away_score FROM matches WHERE id=401")
                print('MATCH401_AFTER', cur.fetchone())
            finally:
                close_db(conn,cur)
            PY
