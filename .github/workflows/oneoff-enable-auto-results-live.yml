name: One-off enable auto results live

on:
  push:
    branches:
      - ops/enable-auto-results-live
    paths:
      - .activate-auto-results-live

permissions:
  contents: read

jobs:
  activate:
    name: Enable and verify live auto-results
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Enable and verify live auto-results
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            expected_release="cb8edd26f8c1b036d06d8899b8066f98d0f61f6d"
            release="$(docker inspect football-totalizator-app-1 --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^TOTISH_RELEASE=//p' | head -n 1)"
            [[ "$release" == "$expected_release" ]] || {
              echo "ACTIVATION REFUSED: production release mismatch: $release" >&2
              exit 1
            }
            export TOTISH_IMAGE="$(docker inspect football-totalizator-app-1 --format '{{.Config.Image}}')"
            [[ -n "$TOTISH_IMAGE" ]]

            test -f scripts/run_auto_results.sh
            test -f scripts/auto_result_runtime.py
            test -f scripts/auto_result_worker.py
            test -f scripts/auto_result_sources.py

            docker compose run --rm -T --interactive=false app python - <<'PY'
            from app.db import close_db, get_db

            conn = get_db()
            cur = conn.cursor()
            try:
                cur.execute(
                    """
                    SELECT 1
                    FROM information_schema.columns
                    WHERE table_name = 'matches'
                      AND column_name = 'result_origin'
                    """
                )
                assert cur.fetchone(), "matches.result_origin is missing"
                print("AUTO RESULTS DB SCHEMA OK")
            finally:
                close_db(conn, cur)
            PY

            backup=".env.backup-auto-results-live-$(date +%Y%m%d%H%M%S)"
            cp .env "$backup"

            if grep -q '^AUTO_RESULTS_ENABLED=' .env; then
              sed -i 's/^AUTO_RESULTS_ENABLED=.*/AUTO_RESULTS_ENABLED=true/' .env
            else
              printf '\nAUTO_RESULTS_ENABLED=true\n' >> .env
            fi
            if grep -q '^AUTO_RESULTS_DRY_RUN=' .env; then
              sed -i 's/^AUTO_RESULTS_DRY_RUN=.*/AUTO_RESULTS_DRY_RUN=false/' .env
            else
              printf 'AUTO_RESULTS_DRY_RUN=false\n' >> .env
            fi

            [[ "$(grep '^AUTO_RESULTS_ENABLED=' .env | tail -n 1)" == "AUTO_RESULTS_ENABLED=true" ]]
            [[ "$(grep '^AUTO_RESULTS_DRY_RUN=' .env | tail -n 1)" == "AUTO_RESULTS_DRY_RUN=false" ]]

            auto_cron_count="$(crontab -l 2>/dev/null | grep -c 'scripts/run_auto_results.sh' || true)"
            [[ "$auto_cron_count" == "1" ]] || {
              echo "ACTIVATION REFUSED: expected exactly one auto-result cron, got $auto_cron_count" >&2
              cp "$backup" .env
              exit 1
            }

            mode_check="$(docker compose run --rm -T --interactive=false app sh -lc 'printf "%s/%s" "$AUTO_RESULTS_ENABLED" "$AUTO_RESULTS_DRY_RUN"')"
            [[ "$mode_check" == "true/false" ]] || {
              echo "ACTIVATION FAILED: container sees $mode_check" >&2
              cp "$backup" .env
              exit 1
            }

            echo "AUTO RESULTS LIVE OK: release=$release enabled=true dry_run=false cron=$auto_cron_count"
