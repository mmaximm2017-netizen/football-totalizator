name: One-off simplify init_db

on:
  push:
    branches:
      - refactor/migration-only-schema-bootstrap

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/migration-only-schema-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simplify init_db
        run: python scripts/oneoff_simplify_init_db.py
      - name: Commit simplification
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/db.py tests/test_db_initialization.py
          git commit -m "Keep init_db data-only"
          git push origin HEAD:refactor/migration-only-schema-bootstrap
