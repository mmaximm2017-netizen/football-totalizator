name: One-off result source probe

on:
  push:
    branches:
      - prototype/auto-result-sources
    paths:
      - .source-probe-trigger

concurrency:
  group: auto-result-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Test pure source parsers
        run: python -m pytest -q tests/test_auto_result_source_probe.py
      - name: Run read-only live probe
        run: python scripts/probe_auto_result_sources.py
