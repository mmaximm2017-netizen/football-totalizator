name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: totish_ci
          POSTGRES_PASSWORD: totish_ci
          POSTGRES_DB: totish_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U totish_ci -d totish_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      API_KEY: ci-test-api-key
      INVITE_CODE: ci-test-invite-code
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-test-admin-password
      DATABASE_URL: postgresql://totish_ci:totish_ci@127.0.0.1:5432/totish_ci
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply migrations to fresh database
        run: python scripts/run_migrations.py

      - name: Bootstrap seed data
        run: python -m app.init_db

      - name: Verify application import
        run: python -c "from app import create_app; app=create_app(); print('APP_IMPORT_OK')"

      - name: Run test suite
        run: pytest -q

  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Block critical Python errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Block unused runtime code
        run: ruff check app scripts --select F401,F841,F541

      - name: Report remaining Ruff findings
        run: ruff check . || true

  security:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit known dependency vulnerabilities
        run: pip-audit -r requirements.txt

  docker:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --progress=plain --build-arg TOTISH_RELEASE="$GITHUB_SHA" -t totish-ci .

  publish:
    name: Publish Docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - test
      - lint
      - security
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Define image tags
        id: image
        run: |
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TOTISH_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/mmaximm2017-netizen/football-totalizator:${{ steps.image.outputs.sha_tag }}
            ghcr.io/mmaximm2017-netizen/football-totalizator:${{ steps.image.outputs.short_sha_tag }}

      - name: Report published image
        run: |
          echo "Image tag: ghcr.io/mmaximm2017-netizen/football-totalizator:${{ steps.image.outputs.sha_tag }}"
          echo "Image tag: ghcr.io/mmaximm2017-netizen/football-totalizator:${{ steps.image.outputs.short_sha_tag }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Save published image reference
        run: |
          echo "ghcr.io/mmaximm2017-netizen/football-totalizator@${{ steps.build.outputs.digest }}" > image-reference.txt

      - name: Upload published image reference
        uses: actions/upload-artifact@v4
        with:
          name: production-image-reference
          path: image-reference.txt
          if-no-files-found: error
          retention-days: 1
