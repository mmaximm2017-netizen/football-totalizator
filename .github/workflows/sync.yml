name: Sync Matches

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-matches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Run sync worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - name: Run sync in the deployed production container
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          envs: PROD_DEPLOY_PATH
          script: |
            exec /bin/bash -s <<'BASH'
            set -Eeuo pipefail

            skip_sync() {
              echo "SYNC_SKIPPED: $1"
              exit 0
            }

            command -v docker >/dev/null 2>&1 || skip_sync "docker is unavailable"
            command -v flock >/dev/null 2>&1 || skip_sync "flock is unavailable"
            [[ -n "${PROD_DEPLOY_PATH:-}" ]] || skip_sync "production deploy path is unavailable"
            cd "$PROD_DEPLOY_PATH" || skip_sync "production deploy path is inaccessible"

            exec 9>/tmp/totish-production-deploy.lock
            flock -n 9 || skip_sync "production deployment is running"

            mapfile -t app_containers < <(
              docker ps \
                --filter 'label=com.docker.compose.project=football-totalizator' \
                --filter 'label=com.docker.compose.service=app' \
                --filter 'status=running' \
                --format '{{.ID}}'
            )
            [[ "${#app_containers[@]}" -eq 1 ]] || \
              skip_sync "expected exactly one running production app container"

            container_id="${app_containers[0]}"
            container_status="$(docker inspect --format '{{.State.Status}}' "$container_id" 2>/dev/null || true)"
            container_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id" 2>/dev/null || true)"
            image_reference="$(docker inspect --format '{{.Config.Image}}' "$container_id" 2>/dev/null || true)"
            container_image_id="$(docker inspect --format '{{.Image}}' "$container_id" 2>/dev/null || true)"

            [[ "$container_status" == "running" ]] || skip_sync "production app container is not running"
            [[ "$container_health" == "healthy" ]] || skip_sync "production app container is not healthy"
            [[ "$image_reference" =~ ^ghcr\.io/mmaximm2017-netizen/football-totalizator@sha256:[0-9a-f]{64}$ ]] || \
              skip_sync "production image is not an immutable TOTISH digest"

            local_image_id="$(docker image inspect --format '{{.Id}}' "$image_reference" 2>/dev/null || true)"
            [[ -n "$local_image_id" && "$local_image_id" == "$container_image_id" ]] || \
              skip_sync "running container does not match its immutable image digest"

            echo "SYNC_REVISION_VERIFIED: $image_reference"
            docker exec --workdir /app "$container_id" python scripts/sync_once.py
            BASH
