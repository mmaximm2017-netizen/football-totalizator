name: Profile Telegram latency
on:
  push:
    branches: [ops/profile-telegram-latency]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Read-only timing samples
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            python3 - <<'PYTRACE'
            import json
            import time
            import subprocess
            from scripts import telegram_admin_bot as bot
            try:
                for kind in ('rpl', 'cup'):
                    start=time.monotonic()
                    text, markup=bot._ui_screen(f'ui:t:ranking:{kind}', 'trace')
                    buttons=[b for row in json.loads(markup)['inline_keyboard'] for b in row]
                    print('TABLE_TRACE_FIRST',kind,'period_picker' if 'Выберите период' in text else 'result',len(text),len(buttons),flush=True)
                    data=next((b['callback_data'] for b in buttons if b['text']=='Весь турнир'),None)
                    if data:
                        text,markup=bot._ui_screen(data,'trace')
                    print('TABLE_TRACE_RESULT',kind,len(text),len(json.loads(markup)['inline_keyboard']),round(1000*(time.monotonic()-start)),flush=True)
                    assert 'очк.' in text or 'Нет завершённых' in text
                    # Exercise callback authorization and rendering without delivering messages.
                    values=bot.load_env()
                    sender=int(values['TELEGRAM_ADMIN_USER_ID'])
                    token,chat=bot._config()
                    deliveries=[]
                    old_request=bot._telegram_request
                    bot._telegram_request=lambda token,method,payload,**kwargs: deliveries.append((method,len(payload.get('text','')))) or True
                    bot._handle_update(token,chat,{'callback_query':{'id':'trace','data':data or f'ui:v:{kind}:ranking:all:0:0','from':{'id':sender},'message':{'chat':{'id':chat},'message_id':1}}})
                    bot._telegram_request=old_request
                    print('TABLE_TRACE_DELIVERY',kind,json.dumps(deliveries),flush=True)
                state=subprocess.run(['systemctl','show','totish-telegram-admin.service','--property=ActiveState,ExecMainStartTimestamp,WorkingDirectory'],capture_output=True,text=True,timeout=10)
                print('TABLE_TRACE_SERVICE',state.stdout.strip().replace('\n',' | '),flush=True)
            finally:
                bot._helper.close()
            PYTRACE
