name: Profile Telegram latency
on:
  push:
    branches: [ops/profile-telegram-latency]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Read-only timing samples
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            python3 - <<'PYBODY'
            import socket
            import time
            from urllib.parse import urlencode
            from scripts import telegram_admin_bot as bot
            resolver=socket.getaddrinfo
            token,_=bot._config()
            cases=[]
            for label,cb in [('table_rpl','ui:t:ranking:rpl'),('table_cup','ui:t:ranking:cup'),('matches','ui:t:matches:rpl')]:
                text,markup=bot._ui_screen(cb,'body-test')
                cases.append((label,{'text':text,'reply_markup':markup}))
            cases.append(('large',{'padding':'x'*6000}))
            for family in (socket.AF_INET6,socket.AF_INET):
                socket.getaddrinfo=lambda host,port,af=0,type=0,proto=0,flags=0: resolver(host,port,family,type,proto,flags)
                for label,payload in cases:
                    start=time.monotonic()
                    try:
                        result=bot._telegram_request(token,'getMe',payload,timeout=3)
                        assert result.get('is_bot')
                        print('BODY_PROBE',family.name,label,len(urlencode(payload)),'ok',round(1000*(time.monotonic()-start)),flush=True)
                    except Exception as exc:
                        print('BODY_PROBE',family.name,label,len(urlencode(payload)),type(exc).__name__,round(1000*(time.monotonic()-start)),flush=True)
            socket.getaddrinfo=resolver
            PYBODY
