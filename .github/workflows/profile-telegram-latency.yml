name: Profile Telegram latency
on:
  push:
    branches: [ops/profile-telegram-latency]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Read-only timing samples
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            python3 - <<'PYNET'
            import json
            import os
            import socket
            import time
            from scripts import telegram_admin_bot as bot
            print('NETWORK_PROXY_CONFIGURED', any(os.getenv(k) for k in ('HTTPS_PROXY','https_proxy','ALL_PROXY','all_proxy')))
            start = time.monotonic()
            addresses = socket.getaddrinfo('api.telegram.org', 443, type=socket.SOCK_STREAM)
            print('NETWORK_DNS_MS', round(1000 * (time.monotonic() - start)))
            seen = set()
            for family, socktype, proto, _, address in addresses:
                if family in seen:
                    continue
                seen.add(family)
                start = time.monotonic()
                try:
                    with socket.socket(family, socktype, proto) as conn:
                        conn.settimeout(2)
                        conn.connect(address)
                    print('NETWORK_TCP', family.name, 'ok', round(1000 * (time.monotonic() - start)), flush=True)
                except Exception as exc:
                    print('NETWORK_TCP', family.name, type(exc).__name__, round(1000 * (time.monotonic() - start)), flush=True)
            token, _ = bot._config()
            original = socket.getaddrinfo
            for mode in ('default', 'ipv4', 'ipv4', 'default'):
                if mode == 'ipv4':
                    socket.getaddrinfo = lambda host, port, family=0, type=0, proto=0, flags=0: original(host, port, socket.AF_INET, type, proto, flags)
                else:
                    socket.getaddrinfo = original
                start = time.monotonic()
                try:
                    result = bot._telegram_request(token, 'getMe', {}, timeout=3)
                    assert result.get('is_bot')
                    print('NETWORK_TELEGRAM', mode, 'ok', round(1000 * (time.monotonic() - start)), flush=True)
                except Exception as exc:
                    print('NETWORK_TELEGRAM', mode, type(exc).__name__, type(getattr(exc, 'reason', None)).__name__, round(1000 * (time.monotonic() - start)), flush=True)
            socket.getaddrinfo = original
            PYNET
