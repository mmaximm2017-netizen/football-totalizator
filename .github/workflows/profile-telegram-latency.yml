name: Profile Telegram latency
on:
  push:
    branches: [ops/profile-telegram-latency]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - name: Read-only timing samples
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          command_timeout: 5m
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            python3 - <<'PYLOG'
            import subprocess
            import re
            props=subprocess.run(['systemctl','show','totish-telegram-admin.service','--property=StandardOutput,StandardError,FragmentPath'],capture_output=True,text=True,timeout=10)
            print('BOT_LOG_TARGET',props.stdout.strip().replace('\n',' | '),flush=True)
            commands=[['journalctl','-u','totish-telegram-admin.service','--since','-45 min','--no-pager','-o','cat']]
            allowed=subprocess.run(['sudo','-n','-l'],capture_output=True,text=True,timeout=10)
            print('BOT_SUDO_LIST_STATUS',allowed.returncode,flush=True)
            print('BOT_SUDO_COMMAND_PATHS',','.join(sorted(set(re.findall(r'/[A-Za-z0-9_./-]+', allowed.stdout)))),flush=True)
            print('BOT_SUDO_NOPASSWD', 'NOPASSWD' in allowed.stdout, flush=True)
            if allowed.returncode==0 and re.search(r'NOPASSWD:[\s\S]*journalctl',allowed.stdout):
                commands.append(['sudo','-n','journalctl','-u','totish-telegram-admin.service','--since','-45 min','--no-pager','-o','cat'])
            for command in commands:
                logs=subprocess.run(command,capture_output=True,text=True,timeout=15)
                print('BOT_JOURNAL_RESULT',logs.returncode,len(logs.stdout.splitlines()),bool(logs.stderr),flush=True)
                for line in logs.stdout.splitlines()[-300:]:
                    found=re.search(r'(telegram_admin_(?:delivery_|query_failed|callback |poller_failed)[A-Za-z0-9_ =:-]*)',line)
                    if found:
                        print('BOT_LOG',found.group(1),flush=True)
            PYLOG
