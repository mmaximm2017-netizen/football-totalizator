name: One-off add monitor recovery

on:
  push:
    branches:
      - audit/check-post-load
    paths:
      - .monitor-recovery-trigger

permissions:
  contents: write

concurrency:
  group: oneoff-add-monitor-recovery
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/check-post-load
      - name: Patch production monitor and add tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/monitor_production.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'STATE_FILE = STATE_DIR / "production-monitor-dedupe.json"\n',
              'STATE_FILE = STATE_DIR / "production-monitor-dedupe.json"\nINCIDENT_STATE_FILE = STATE_DIR / "production-monitor-incidents.json"\n'
          )
          text = text.replace(
              'from host_telegram_notifier import send_message\n',
              'from host_telegram_notifier import send_message\nfrom monitor_recovery_state import recover_incident, remember_incident\n'
          )
          text = text.replace(
              '    send_message(message)\n\n    state[fingerprint] = now\n',
              '    send_message(message)\n    remember_incident(INCIDENT_STATE_FILE, key)\n\n    state[fingerprint] = now\n'
          )

          replacements = {
              '    return True\n\ndef check_local_health():': '    recover_incident(INCIDENT_STATE_FILE, "container", send_message)\n    return True\n\ndef check_local_health():',
              '        return True\n\n    except Exception as exc:\n': '        recover_incident(INCIDENT_STATE_FILE, "health:local", send_message)\n        return True\n\n    except Exception as exc:\n',
              '    if not bad:\n        return True\n': '    if not bad:\n        recover_incident(INCIDENT_STATE_FILE, "health:db", send_message)\n        return True\n',
              '    if not backup_dir.exists():\n        return True\n': '    if not backup_dir.exists():\n        recover_incident(INCIDENT_STATE_FILE, "backup", send_message)\n        return True\n',
              '    return True\n\n\ndef check_control_plane_release():': '    recover_incident(INCIDENT_STATE_FILE, "backup", send_message)\n    return True\n\n\ndef check_control_plane_release():',
              '    return True\n\n\ndef check_public_health():': '    recover_incident(INCIDENT_STATE_FILE, "control_plane", send_message)\n    return True\n\n\ndef check_public_health():',
              '        return True\n\n    except Exception as exc:\n        reason =': '        recover_incident(INCIDENT_STATE_FILE, "health:public", send_message)\n        return True\n\n    except Exception as exc:\n        reason =',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_monitor_recovery_state.py')
          test.write_text('''from pathlib import Path\n\nfrom scripts.monitor_recovery_state import (\n    incident_family,\n    load_active_incidents,\n    recover_incident,\n    remember_incident,\n)\n\n\ndef test_incident_family_groups_variants():\n    assert incident_family("health:public:unavailable") == "health:public"\n    assert incident_family("health:db:connection") == "health:db"\n    assert incident_family("container:missing") == "container"\n    assert incident_family("backup:stale") == "backup"\n\n\ndef test_recovery_is_sent_once(tmp_path: Path):\n    state = tmp_path / "incidents.json"\n    messages = []\n    remember_incident(state, "health:public:unavailable")\n\n    assert recover_incident(state, "health:public", messages.append) is True\n    assert len(messages) == 1\n    assert "работа восстановлена" in messages[0]\n    assert "health:public:unavailable" in messages[0]\n    assert load_active_incidents(state) == {}\n\n    assert recover_incident(state, "health:public", messages.append) is False\n    assert len(messages) == 1\n\n\ndef test_new_error_replaces_same_family_variant(tmp_path: Path):\n    state = tmp_path / "incidents.json"\n    remember_incident(state, "health:db:connection")\n    remember_incident(state, "health:db:ranking")\n    assert load_active_incidents(state) == {"health:db": "health:db:ranking"}\n''', encoding='utf-8')
          PY
          python -m py_compile scripts/monitor_production.py scripts/monitor_recovery_state.py
          pytest -q tests/test_monitor_recovery_state.py
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/monitor_production.py tests/test_monitor_recovery_state.py
          git commit -m "Notify when production incidents recover"
          git push origin HEAD:audit/check-post-load
