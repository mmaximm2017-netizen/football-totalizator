name: One-off production load probe

on:
  push:
    branches:
      - audit/load-test-production
    paths:
      - .load-probe-trigger

permissions:
  contents: read

concurrency:
  group: totish-oneoff-production-load-probe
  cancel-in-progress: true

jobs:
  load-probe:
    name: Endpoint load diagnostics
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Run endpoint diagnostics on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            auth_data="$(docker exec -i football-totalizator-app-1 python - <<'PY'
            from wsgi import app
            from app.db import get_db, close_db
            conn = get_db(); cur = conn.cursor()
            try:
                cur.execute("SELECT id FROM users WHERE COALESCE(is_deleted, 0)=0 ORDER BY is_admin DESC, id LIMIT 1")
                uid = cur.fetchone()[0]
                cur.execute("SELECT id FROM tournaments WHERE is_active=1 ORDER BY id LIMIT 1")
                tid = cur.fetchone()[0]
            finally:
                close_db(conn, cur)
            s = app.session_interface.get_signing_serializer(app)
            cookie = s.dumps({'user_id': uid, 'selected_tournament_id': tid, 'tournament_selection_initialized': True, '_permanent': True})
            print(f"{uid}|{tid}|{cookie}")
            PY
            )"
            IFS='|' read -r uid tid cookie <<< "$auth_data"
            test -n "$cookie"

            cat > /tmp/totish_endpoint_probe.py <<'PY'
            import concurrent.futures, math, os, time, urllib.request
            base = 'http://127.0.0.1:8000'
            cookie = os.environ['COOKIE']
            tid = os.environ['TID']
            endpoints = [('home', f'/?tid={tid}'), ('table', f'/table?tid={tid}'), ('profile', f'/profile?tid={tid}')]

            def pct(values, q):
                v = sorted(values)
                return v[max(0, min(len(v)-1, math.ceil(len(v)*q)-1))]

            def hit(path):
                req = urllib.request.Request(base + path, headers={'Cookie': f'session={cookie}', 'User-Agent': 'TOTISH-endpoint-probe/1.0'})
                t = time.perf_counter()
                try:
                    with urllib.request.urlopen(req, timeout=15) as r:
                        r.read(); status = r.status
                    err = None
                except Exception as exc:
                    status = getattr(exc, 'code', 0) or 0; err = str(exc)
                return status, time.perf_counter()-t, err

            print('=== ENDPOINT DIAGNOSTICS ===')
            for name, path in endpoints:
                for concurrency in (1, 4):
                    total = 12
                    t = time.perf_counter()
                    with concurrent.futures.ThreadPoolExecutor(max_workers=concurrency) as pool:
                        rows = list(pool.map(lambda _: hit(path), range(total)))
                    wall = time.perf_counter()-t
                    lat = [x[1] for x in rows]
                    errors = [x for x in rows if x[0] != 200 or x[2]]
                    print(f'ENDPOINT={name} concurrency={concurrency} requests={total} errors={len(errors)} rps={total/wall:.2f} p50={pct(lat,.5):.3f}s p95={pct(lat,.95):.3f}s max={max(lat):.3f}s')
            PY

            export COOKIE="$cookie" TID="$tid"
            python3 /tmp/totish_endpoint_probe.py
            rm -f /tmp/totish_endpoint_probe.py

            echo '=== HEALTH AFTER ==='
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health
            echo
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}' football-totalizator-app-1
