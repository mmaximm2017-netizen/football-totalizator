name: Activate Telegram UI 89

on:
  push:
    branches: [ops/activate-telegram-ui-89]

permissions:
  contents: read

jobs:
  activate:
    name: Verify deployed Telegram UI
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Verify release and guided UI without service privileges
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            exec 9>/tmp/totish-production-deploy.lock
            flock -w 60 9
            expected=1f3a525be1b3a4307f4b815826635c85f30f6f47
            test "$(cat .totish-managed-release)" = "$expected"
            actual="$(docker exec football-totalizator-app-1 python -c 'import os; print(os.environ.get("TOTISH_RELEASE", ""))')"
            test "$actual" = "$expected"
            python3 - <<'PY'
            import hashlib
            from pathlib import Path

            expected = {
                'scripts/telegram_admin_bot.py': '9ab3fec770159e8ed96b44aee069421e48c9fd8612f7c26137ab006772e7ed99',
                'scripts/telegram_bot_ui.py': 'ca1a857f8725b6954ebf604e55971e803a432584f32a12991db33dc1dadd7b72',
            }
            for path, digest in expected.items():
                assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, 'host source mismatch'
            print('DEPLOYED_RELEASE_AND_HOST_SOURCE_OK')
            print('TELEGRAM_RESTART_REQUIRES_ROOT')
            PY
            docker exec -i football-totalizator-app-1 python - <<'PY'
            from app.services.telegram_admin_service import dispatch_request
            for kind in ('rpl', 'cup'):
                for cb in (f'ui:v:{kind}:ranking:all:0:0', f'ui:r:{kind}:points:all:0:0', f'ui:v:{kind}:predictions:today:0:0'):
                    result = dispatch_request({'action': 'assistant-ui', 'callback': cb})
                    assert result['text'] and result['rows'], 'guided result unavailable'
                users = dispatch_request({'action': 'assistant-ui', 'callback': f'ui:u:{kind}:card:all:0:0'})
                cards = [b['callback_data'] for row in users['rows'] for b in row if b['callback_data'].startswith(f'ui:v:{kind}:card:')]
                if cards:
                    result = dispatch_request({'action': 'assistant-ui', 'callback': cards[0]})
                    assert result['text'] and result['rows'], 'participant card unavailable'
            print('READ_ONLY_UI_PRODUCTION_SMOKE_OK')
            PY
            python3 - <<'PY'
            from scripts import telegram_admin_bot as bot
            try:
                token, _chat = bot._config()
                result = bot._telegram_request(token, 'getMe', {}, timeout=5)
                assert result.get('is_bot') is True
            except Exception:
                raise SystemExit('TELEGRAM_CONNECTIVITY_CHECK_FAILED') from None
            print('TELEGRAM_CONNECTIVITY_OK')
            PY
            curl --fail --silent --show-error --max-time 10 https://totish.ru/health
